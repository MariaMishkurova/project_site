{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Calendar</title>
    <!-- Подключаем FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <!-- Подключаем кастомный CSS -->
    <link rel="stylesheet" href="{% static 'main/css/calendar.css' %}">

    <!-- Подключаем FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales-all.min.js"></script>

</head>
<body>
<div class="home_calendar">
<a href="{% url 'main' %}"> <img src="{% static 'main/images/homeBlack.png' %}" alt="На главную"></a>
</div>
<div id="calendar-container">
    <!-- Кнопка "Вернуться" -->
    <button id="return-btn">
        <img src="{% static 'main/images/return.png' %}" alt="Return">
    </button>

    <!-- Контейнер календаря -->
    <div id="calendar"></div>

    <!-- Кнопки навигации с иконками -->
    <button id="prev-btn" class="nav-btn">
        <img src="{% static 'main/images/prev.png' %}" alt="Prev" width="40" height="40">
    </button>
    <button id="next-btn" class="nav-btn">
        <img src="{% static 'main/images/next.png' %}" alt="Next" width="40" height="40">
    </button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'ru',
            headerToolbar: {
                left: '',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            events: [],
            contentHeight: 'auto',  // Подстраиваем высоту календаря
            aspectRatio: 1.5,  // Ширина будет в 1.5 раза больше высоты
            views: {
                dayGridMonth: {
                    height: 'auto',  // Делаем высоту автоматически
                }
            },
            fixedWeekCount: true,  // Включаем фиксированное количество недель (всегда 6 недель)
            showNonCurrentDates: true, // Включаем отображение дат другого месяца
        });

        // Инициализация календаря
        calendar.render();

        // Обработчики для кнопок навигации
        document.getElementById('prev-btn').addEventListener('click', function () {
            calendar.prev();  // Переход на предыдущий месяц
        });

        document.getElementById('next-btn').addEventListener('click', function () {
            calendar.next();  // Переход на следующий месяц
        });

        document.getElementById('return-btn').addEventListener('click', function () {
            calendar.today();  // Переход на сегодняшний день
        });
    });
</script>
</body>
</html>
